<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Memory · 记忆管理</title>
  <link rel="stylesheet" href="/console.css">
  <script src="/console.js" defer></script>
</head>
<body>
<header><a href="/">Agent Memory</a><span id="session-name">记忆管理</span></header>
<main>
  <section id="login" class="panel">
    <h1>访问工作台</h1>
    <form><label>访问令牌<input name="token" type="password" autocomplete="off" required></label><button>登录</button></form>
  </section>
  <div id="workspace" hidden>
    <aside>
      <h2>工作区</h2>
      <nav id="nav"></nav>
      <button type="button" class="plain" id="disconnect">退出登录</button>
    </aside>
    <article>
      <div class="mast"><h1 id="title"></h1><button id="refresh" class="plain" type="button" hidden>刷新</button></div>
      <div id="content"></div>
    </article>
  </div>
  <output id="notice" role="status" aria-live="polite"></output>
</main>
</body>
</html>
